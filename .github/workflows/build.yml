name: Build Firefox TV (Gecko only)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build-gecko:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Print resolved GeckoView runtime dependency
        run: bash ./gradlew :app:dependencyInsight --configuration geckoDebugRuntimeClasspath --dependency org.mozilla.geckoview

      - name: Build Gecko debug APK
        run: bash ./gradlew :app:assembleGeckoDebug --stacktrace

      - name: Save Gecko APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-TV-Gecko-debug-APK
          path: app/build/outputs/apk/gecko/debug/*.apk
          if-no-files-found: error
          retention-days: 1
