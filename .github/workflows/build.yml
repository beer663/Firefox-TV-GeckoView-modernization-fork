name: Build Firefox TV (Gecko only)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build-gecko:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      # SDK Manager publishes API 37 as android-37.0, but some tooling still
      # looks for the legacy android-37 directory when compileSdk is 37.
      - name: Verify Android 37 SDK for Gradle
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
          echo "Android API 37.0 SDK is installed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Print resolved GeckoView runtime dependency
        run: bash ./gradlew :app:dependencyInsight --configuration geckoDebugRuntimeClasspath --dependency org.mozilla.geckoview

      - name: Build Gecko debug APK
        run: bash ./gradlew :app:assembleGeckoDebug --stacktrace

      - name: Save Gecko APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-TV-Gecko-debug-APK
          path: app/build/outputs/apk/gecko/debug/*.apk
          if-no-files-found: error
          retention-days: 1
