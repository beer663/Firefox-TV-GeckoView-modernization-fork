name: Build Firefox TV

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        engine: [system, gecko]
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.engine }} debug APK
        run: |
          if [ "${{ matrix.engine }}" = "gecko" ]; then
            bash ./gradlew :app:assembleGeckoDebug --stacktrace
          else
            bash ./gradlew :app:assembleSystemDebug --stacktrace
          fi

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-TV-${{ matrix.engine }}-debug-APK
          path: app/build/outputs/apk/${{ matrix.engine }}/debug/*.apk
          if-no-files-found: error
