name: Build Firefox TV (ARMv7 release download)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gecko:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Verify Android 37 SDK for Gradle
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore persistent TV signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in repository Actions secrets. Keep the same key for every build."
            exit 1
          fi

          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          encoded = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())

          try:
              data = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError):
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is not valid base64.')

          if not data:
              raise SystemExit('The signing keystore is empty.')

          keystore = Path(os.environ['RUNNER_TEMP']) / 'moms-firefox-tv-signing.jks'
          keystore.write_bytes(data)

          version_code = 1000 + int(os.environ['GITHUB_RUN_NUMBER'])
          if version_code > 2100000000:
              raise SystemExit('Version code exceeds the Android limit.')

          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'TV_SIGNING_STORE_FILE={keystore}\n')
              environment.write(f'TV_VERSION_CODE={version_code}\n')
          PY

          keytool -list \
            -keystore "$RUNNER_TEMP/moms-firefox-tv-signing.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Print resolved GeckoView runtime dependency
        env:
          TV_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TV_SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash ./gradlew :app:dependencyInsight --configuration geckoDebugRuntimeClasspath --dependency org.mozilla.geckoview

      - name: Build signed Gecko debug APK
        env:
          TV_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TV_SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash ./gradlew :app:assembleGeckoDebug -PtvVersionCode="$TV_VERSION_CODE" -PtvVersionName="4.8.$GITHUB_RUN_NUMBER" --stacktrace

      - name: Prepare and verify ARMv7 APK
        shell: bash
        run: |
          mkdir -p release-files

          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          apks = list(Path('app/build/outputs/apk/gecko/debug').glob('*.apk'))

          if len(apks) != 1:
              raise SystemExit(f'Expected exactly one APK, found {len(apks)}')

          with zipfile.ZipFile(apks[0]) as archive:
              abis = {
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and name.endswith('.so')
              }

          if abis != {'armeabi-v7a'}:
              raise SystemExit(
                  f'Expected ARMv7 only, found: {sorted(abis)}. '
                  'Set abiFilters to armeabi-v7a in app/build.gradle.'
              )

          shutil.copyfile(
              apks[0],
              'release-files/Moms-Firefox-TV-ARMv7-debug.apk'
          )

          print('Verified ARMv7-only APK.')
          PY

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify release-files/Moms-Firefox-TV-ARMv7-debug.apk

      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tv-armv7-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-files/Moms-Firefox-TV-ARMv7-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Mom's Firefox TV ARMv7 - Build $GITHUB_RUN_NUMBER" \
            --notes "ARMv7 development APK signed with the persistent TV key. Package: org.mozilla.tv.firefox.debug. Android version code: $TV_VERSION_CODE." \
            --prerelease

      - name: Remove temporary signing file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/moms-firefox-tv-signing.jks"
