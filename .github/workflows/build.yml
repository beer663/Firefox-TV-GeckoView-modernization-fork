name: Build Mom Firefox and publish GitHub release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gecko:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Verify Android 37 SDK for Gradle
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          test -n "$SDK_ROOT"
          test -f "$SDK_ROOT/platforms/android-37.0/android.jar"
          if [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Print resolved GeckoView runtime dependency
        run: bash ./gradlew :app:dependencyInsight --configuration geckoDebugRuntimeClasspath --dependency org.mozilla.geckoview

      - name: Build and check separate Gecko debug APKs
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          mkdir -p release-files

          for browser_abi in armeabi-v7a arm64-v8a x86_64; do
            bash ./gradlew :app:assembleGeckoDebug \
              -PtvAbi="$browser_abi" \
              -PtvVersionCode="$version_code" \
              -PtvVersionName="5.0.$GITHUB_RUN_NUMBER" \
              --stacktrace

            python3 - "$browser_abi" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          import zipfile

          expected_abi = sys.argv[1]
          labels = {
              'armeabi-v7a': 'ARMv7',
              'arm64-v8a': 'ARM64-v8a',
              'x86_64': 'x86_64',
          }

          apks = list(Path('app/build/outputs/apk/gecko/debug').glob('*.apk'))

          if len(apks) != 1:
              raise SystemExit(f'Expected exactly one APK, found {len(apks)}')

          with zipfile.ZipFile(apks[0]) as archive:
              corrupt = archive.testzip()
              if corrupt is not None:
                  raise SystemExit(f'Corrupt APK entry: {corrupt}')

              abis = {
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and name.endswith('.so')
              }

          if abis != {expected_abi}:
              raise SystemExit(
                  f'Expected only {expected_abi}, found: {sorted(abis)}'
              )

          destination = Path('release-files') / (
              f'Moms-Firefox-TV-{labels[expected_abi]}-debug.apk'
          )
          shutil.copyfile(apks[0], destination)
          print(f'Prepared {destination} containing only {expected_abi}.')
          PY
          done

      - name: Verify all three APKs and signatures
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          expected = {
              'Moms-Firefox-TV-ARMv7-debug.apk',
              'Moms-Firefox-TV-ARM64-v8a-debug.apk',
              'Moms-Firefox-TV-x86_64-debug.apk',
          }
          actual = {path.name for path in Path('release-files').glob('*.apk')}

          if actual != expected:
              raise SystemExit(f'Expected three architecture APKs, found: {sorted(actual)}')
          PY

          for browser_apk in release-files/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$browser_apk"
          done

      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: tv-gecko-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            release-files/*.apk \
            --target "$GITHUB_SHA" \
            --title "Mom Firefox 5.0.$GITHUB_RUN_NUMBER - separate debug APKs" \
            --notes-file RELEASE-NOTES.md \
            --latest
