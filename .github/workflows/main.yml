name: Build Firefox TV

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build System and Gecko debug APKs
        run: ./gradlew :app:assembleSystemDebug :app:assembleGeckoDebug --stacktrace

      - name: Save System APK
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-TV-system-debug-APK
          path: app/build/outputs/apk/system/debug/*.apk
          if-no-files-found: error

      - name: Save Gecko APK
        uses: actions/upload-artifact@v4
        with:
          name: Firefox-TV-gecko-debug-APK
          path: app/build/outputs/apk/gecko/debug/*.apk
          if-no-files-found: error
