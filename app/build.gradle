apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def tvSigningStoreFile = System.getenv('TV_SIGNING_STORE_FILE')
def tvSigningPassword = System.getenv('TV_SIGNING_PASSWORD')
def tvSigningAlias = System.getenv('TV_SIGNING_ALIAS')
def tvSigningValues = [
    tvSigningStoreFile,
    tvSigningPassword,
    tvSigningAlias
]

def hasTvSigning = tvSigningValues.any {
    it != null && !it.isEmpty()
}

if (hasTvSigning && tvSigningValues.any {
    it == null || it.isEmpty()
}) {
    throw new GradleException(
        'Provide all three TV_SIGNING_STORE_FILE, TV_SIGNING_PASSWORD and TV_SIGNING_ALIAS variables, or none for a local debug build.'
    )
}

if (hasTvSigning && !file(tvSigningStoreFile).isFile()) {
    throw new GradleException(
        'The configured TV signing keystore file does not exist.'
    )
}

def tvVersionCodeText =
    (findProperty('tvVersionCode') ?: '11').toString()

if (
    !(tvVersionCodeText ==~ /[0-9]+/) ||
    tvVersionCodeText.toBigInteger() < 1 ||
    tvVersionCodeText.toBigInteger() > 2100000000
) {
    throw new GradleException(
        'tvVersionCode must be an integer between 1 and 2100000000.'
    )
}

def tvVersionCode = tvVersionCodeText.toInteger()
def tvVersionName =
    (findProperty('tvVersionName') ?: '4.8').toString()

android {
    namespace 'org.mozilla.tv.firefox'
    compileSdk 37

    defaultConfig {
        applicationId "org.mozilla.tv.firefox"
        minSdk 26
        targetSdk 28
        versionCode tvVersionCode
        versionName tvVersionName

        testInstrumentationRunner "org.mozilla.tv.firefox.FirefoxOnDeviceTestRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'

        multiDexEnabled true

        ndk {
            abiFilters 'armeabi-v7a'
        }

        buildConfigField 'String', 'SENTRY_DSN', 'null'
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        lintConfig file("lint.xml")
        baseline file("lint-baseline.xml")
        abortOnError false
    }

    signingConfigs {
        if (hasTvSigning) {
            tvPersistent {
                storeFile file(tvSigningStoreFile)
                storePassword tvSigningPassword
                keyAlias tvSigningAlias
                keyPassword tvSigningPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"

            if (hasTvSigning) {
                signingConfig signingConfigs.tvPersistent
            }
        }
    }

    flavorDimensions "engine"

    productFlavors {
        system {
            dimension "engine"
        }

        gecko {
            dimension "engine"
        }
    }

    testOptions {
        unitTests.includeAndroidResources true
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/proguard/androidx-annotations.pro',
                'META-INF/atomicfu.kotlin_module'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        if (variantBuilder.name.startsWith('system')) {
            variantBuilder.enable = false
        }
    }
}

tasks.withType(
    org.jetbrains.kotlin.gradle.tasks.KotlinCompile
).configureEach {
    kotlinOptions {
        allWarningsAsErrors = false
        jvmTarget = '17'
    }
}

