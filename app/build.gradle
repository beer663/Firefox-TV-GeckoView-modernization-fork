plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def browserVersionCode = (project.findProperty('tvVersionCode') ?: '12').toString().toInteger()
def browserVersionName = (project.findProperty('tvVersionName') ?: '5.0').toString()
def browserAbis = (project.findProperty('tvAbi') ?: 'armeabi-v7a').toString().split(',')

android {
    namespace 'org.mozilla.tv.firefox'
    compileSdk 37

    defaultConfig {
        applicationId 'org.mozilla.tv.firefox'
        minSdk 26
        targetSdk 28
        versionCode browserVersionCode
        versionName browserVersionName

        ndk {
            abiFilters.addAll(browserAbis as List)
        }
    }

    // Compress native libraries in the APK; Android extracts them on install.
    packaging {
        jniLibs {
            useLegacyPackaging = true

            // Avoid copying unused architectures into intermediate build outputs.
            ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
                if (!browserAbis.contains(abi)) excludes.add("**/${abi}/**")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    flavorDimensions 'engine'

    productFlavors {
        gecko {
            dimension 'engine'
        }
    }

    // The old Firefox source tree is outside the compiled app.
    sourceSets {
        main {
            manifest.srcFile 'src/browser/AndroidManifest.xml'
            java.setSrcDirs(['src/browser/java', 'build/generated/cleanBrowser/java'])
            kotlin.setSrcDirs(['src/browser/java', 'build/generated/cleanBrowser/java'])
            res.setSrcDirs(['src/browser/res', 'build/generated/cleanBrowser/res'])
            assets.setSrcDirs(['src/browser/assets'])
            aidl.setSrcDirs([])
        }

        gecko {
            manifest.srcFile 'src/browser/empty-manifest.xml'
            java.setSrcDirs([])
            kotlin.setSrcDirs([])
            res.setSrcDirs([])
        }

        debug {
            manifest.srcFile 'src/browser/empty-manifest.xml'
        }

        release {
            manifest.srcFile 'src/browser/empty-manifest.xml'
        }

        test {
            java.setSrcDirs([])
            kotlin.setSrcDirs([])
            res.setSrcDirs([])
        }

        androidTest {
            java.setSrcDirs([])
            kotlin.setSrcDirs([])
            res.setSrcDirs([])
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
    }
}

tasks.register('prepareCleanBrowser', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tools/prepare_clean_browser.py'
    inputs.dir('src/main/java')
    inputs.dir('src/main/res')
    inputs.file(rootProject.file('tools/prepare_clean_browser.py'))
    outputs.dir('build/generated/cleanBrowser')
}

tasks.named('preBuild').configure {
    dependsOn 'prepareCleanBrowser'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '17'
    dependsOn 'prepareCleanBrowser'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
}
