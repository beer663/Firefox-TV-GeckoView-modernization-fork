# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Android Studio sets android.inject.testOnly automatically on some APKs that are ran from the IDE
# However on some devices the APK can not be installed. This is a work-around
android.inject.testOnly = false

android.useAndroidX=true
android.enableJetifier=true

# Keep the old behaviour: R.* of libraries is reachable through the app's R class.
android.nonTransitiveRClass=false

# AGP 9.1 transitional compatibility for this migrated Firefox TV codebase.
# Keep the existing kotlin-android plugin / KotlinCompile tasks for now;
# AGP 9 enables built-in Kotlin and the new DSL by default.
# Both switches are transitional and should be removed after migrating
# to AGP's built-in Kotlin and the new DSL.
android.builtInKotlin=false
android.newDsl=false
